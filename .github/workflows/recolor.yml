name: PDF Vector Recolor

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build
        run: mvn -B compile

      - name: Run
        run: |
          mkdir -p output
          mvn exec:java \
            -Dexec.mainClass=VectorRecolor \
            -Dexec.args="input.pdf output/result.pdf"

      - uses: actions/upload-artifact@v4
        with:
          name: pdf-output
          path: output/result.pdf
