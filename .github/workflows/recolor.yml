name: Vector Recolor

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build project
        run: mvn -B clean compile

      - name: Run program
        run: mvn exec:java

      - name: Upload output PDF
        uses: actions/upload-artifact@v4
        with:
          name: vector-recolor-output
          path: pdfs/output.pdf
