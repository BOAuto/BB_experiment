name: Process PDF Vectors

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allows you to manually click "Run workflow" in GitHub UI

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Download PDFBox 3.0.4 Jars & Dependencies
      run: |
        mkdir -p lib
        curl -sL https://repo1.maven.org/maven2/org/apache/pdfbox/pdfbox/3.0.4/pdfbox-3.0.4.jar -o lib/pdfbox-3.0.4.jar
        curl -sL https://repo1.maven.org/maven2/org/apache/pdfbox/pdfbox-io/3.0.4/pdfbox-io-3.0.4.jar -o lib/pdfbox-io-3.0.4.jar
        # --- THE FIX: Download FontBox which PDFBox requires for processing text/fonts ---
        curl -sL https://repo1.maven.org/maven2/org/apache/pdfbox/fontbox/3.0.4/fontbox-3.0.4.jar -o lib/fontbox-3.0.4.jar
        curl -sL https://repo1.maven.org/maven2/commons-logging/commons-logging/1.3.4/commons-logging-1.3.4.jar -o lib/commons-logging-1.3.4.jar

    - name: Compile Java Code
      run: |
        mkdir -p bin
        javac -cp "lib/*" -d bin src/main/java/VectorRecolor.java

    - name: Ensure input directory exists
      run: mkdir -p pdfs

    - name: Run Vector Recolor Script
      run: |
        java -cp "bin:lib/*" main.java.VectorRecolor

    - name: Upload Processed PDFs
      uses: actions/upload-artifact@v4
      with:
        name: processed-pdfs
        path: output_artifacts/
